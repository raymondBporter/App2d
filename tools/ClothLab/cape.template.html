<div id="puppet-cape-lab">
  <div class="viz-controls">
    <label class="form-label">Animation<select class="form-select" data-key="gait"><option value="run">Run</option><option value="walk">Walk</option><option value="transition">Walk → run → walk</option></select></label>
    <label class="form-label">Animation rate <span data-value="rate">1.00×</span><input class="form-range" data-key="rate" type="range" min="0.5" max="1.5" step="0.05" value="1"></label>
  </div>
  <div class="cape-stage"><canvas aria-label="The App2d walking and running puppet with a shoulder-attached simulated cape. Drag to rotate the view."></canvas><div data-error role="alert" hidden></div></div>
  <div class="viz-row">
    <button class="btn" type="button" data-action="pause">Pause</button>
    <button class="btn" type="button" data-action="view">Side view</button>
    <label class="form-check"><input class="form-check-input" data-key="air" type="checkbox" checked><span class="form-check-label">Air from travel</span></label>
    <label class="form-check"><input class="form-check-input" data-key="collision" type="checkbox" checked><span class="form-check-label">Body collision</span></label>
    <label class="form-check"><input class="form-check-input" data-key="arms" type="checkbox" checked><span class="form-check-label">Arm collision</span></label>
  </div>
  <div class="viz-controls" style="margin-top:12px">
    <label class="form-label">Simulation vertices <span data-value="mesh">117 · 9 × 13</span><input class="form-range" data-key="mesh" type="range" min="1" max="8" step="1" value="4"></label>
    <label class="form-label">Extra headwind <span data-value="headwind">0.0 u/s</span><input class="form-range" data-key="headwind" type="range" min="0" max="3" step="0.1" value="0"></label>
    <label class="form-label">Bend stiffness <span data-value="bend">40%</span><input class="form-range" data-key="bend" type="range" min="0" max="100" step="1" value="40"></label>
  </div>
  <div class="viz-row">
    <label class="form-check"><input class="form-check-input" data-key="smooth" type="checkbox" checked><span class="form-check-label">Smooth surface</span></label>
    <label class="form-check"><input class="form-check-input" data-key="wire" type="checkbox"><span class="form-check-label">Physics mesh</span></label>
    <label class="form-check"><input class="form-check-input" data-key="cape" type="checkbox" checked><span class="form-check-label">Cape</span></label>
    <span class="text-small">Drag to orbit</span>
  </div>
  <div class="text-small tabular-nums" data-speed style="margin-top:8px"></div>
  <div class="text-small" data-status aria-live="polite"></div>
</div>
<style>
#puppet-cape-lab .cape-stage{height:400px;width:100%;position:relative;margin:12px 0;}
#puppet-cape-lab canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
#puppet-cape-lab canvas:active{cursor:grabbing;}
#puppet-cape-lab [data-error]{position:absolute;inset:20px;background:var(--background);color:var(--foreground);}
@media(max-width:480px){#puppet-cape-lab .cape-stage{height:310px;}}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
/*__CAPE_SIMULATION__*/
(() => {
  const data=/*__PUPPET_DATA__*/;
  const root=document.getElementById('puppet-cape-lab'),q=s=>root.querySelector(s),canvas=q('canvas');
  const opts={gait:'transition',rate:1,headwind:0,air:true,collision:true,arms:true,bend:0,smooth:true,wire:false,cape:true,mesh:5};
  function restore(state){const s=state?.modelContent;if(!s)return;for(const k of Object.keys(opts))if(typeof s[k]===typeof opts[k])opts[k]=s[k];if(!['walk','run','transition'].includes(opts.gait))opts.gait='run';opts.rate=Math.max(.5,Math.min(1.5,opts.rate));opts.headwind=Math.max(0,Math.min(3,opts.headwind));opts.bend=Math.max(0,Math.min(100,opts.bend));opts.mesh=Math.max(1,Math.min(8,Math.round(opts.mesh)));}
  restore(window.openai?.widgetState);
  let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function sync(){for(const el of root.querySelectorAll('[data-key]')){const k=el.dataset.key;if(el.type==='checkbox')el.checked=opts[k];else el.value=opts[k];}const count=(2*opts.mesh+1)*(3*opts.mesh+1);q('[data-value="mesh"]').textContent=count+' · '+(2*opts.mesh+1)+' × '+(3*opts.mesh+1);q('[data-value="rate"]').textContent=opts.rate.toFixed(2)+'×';q('[data-value="headwind"]').textContent=opts.headwind.toFixed(1)+' u/s';q('[data-value="bend"]').textContent=opts.bend+'%';q('[data-action="pause"]').textContent=paused?'Play':'Pause';q('[data-status]').textContent=count+' simulated vertices · '+(opts.smooth?'1,617':count)+' rendered vertices · self-collision off';}
  function save(){window.openai?.setWidgetState({modelContent:{...opts},privateContent:null})?.catch(()=>{});}
  sync();
  try {
  if(!window.THREE)throw Error('The 3D library could not load. Reopen this view with access to cdn.jsdelivr.net.');
  const T=THREE,sim=new PuppetCapeSimulation(data,opts);
  const renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  // The stage intentionally matches the existing puppet artwork's paper/ink palette.
  renderer.setClearColor('#eeeee3',1);
  const scene=new T.Scene(),camera=new T.OrthographicCamera(-2.5,2,2,-1,.1,30),target=new T.Vector3(-.52,1.14,0);
  let azimuth=0,elevation=.03;
  const view=new T.Vector3();
  function aim(){camera.position.set(target.x+8*Math.sin(azimuth)*Math.cos(elevation),target.y+8*Math.sin(elevation),8*Math.cos(azimuth)*Math.cos(elevation));camera.lookAt(target);camera.updateMatrixWorld();view.copy(camera.position).sub(target).normalize();}aim();
  const ink=new T.MeshBasicMaterial({color:data.run.ink,side:T.DoubleSide});
  const limbGeo=new T.CylinderGeometry(.0225,.0225,1,10),capGeo=new T.SphereGeometry(.0225,10,6),unitY=new T.Vector3(0,1,0);
  const strokes=data.run.parts.filter(p=>p.kind==='stroke').map(part=>{const rod=new T.Mesh(limbGeo,ink),a=new T.Mesh(capGeo,ink),b=new T.Mesh(capGeo,ink);scene.add(rod,a,b);return{part,rod,a,b};});
  function contour(part){const points=[];if(part.kind==='ellipse'){for(let i=0;i<64;i++){const t=i*Math.PI*2/64;points.push(new T.Vector2(Math.cos(t)*part.width/2,Math.sin(t)*part.height/2));}}
    else{const r=Math.min(part.width,part.height)*.5*part.roundness;for(let corner=0;corner<4;corner++){const a=corner*Math.PI/2,cx=(corner===0||corner===3?1:-1)*(part.width/2-r),cy=(corner<2?1:-1)*(part.height/2-r);for(let i=0;i<=8;i++)points.push(new T.Vector2(cx+Math.cos(a+i*Math.PI/16)*r,cy+Math.sin(a+i*Math.PI/16)*r));}}return points;}
  const shapes=data.run.parts.filter(p=>p.kind!=='stroke').map(part=>{const group=new T.Group(),points=contour(part),shape=new T.Shape(points),geo=new T.ShapeGeometry(shape),outer=new T.Mesh(geo,ink),fill=new T.Mesh(geo,new T.MeshBasicMaterial({color:part.fill,side:T.DoubleSide}));outer.scale.set((part.width+data.run.lineWidth)/part.width,(part.height+data.run.lineWidth)/part.height,1);outer.position.set(part.offsetX,part.offsetY,-.001);fill.position.set(part.offsetX,part.offsetY,.001);fill.scale.set((part.width-data.run.lineWidth)/part.width,(part.height-data.run.lineWidth)/part.height,1);group.add(outer,fill);scene.add(group);return{part,group};});
  const head=shapes.find(p=>p.part.id==='head'),face=new T.Group();head.group.add(face);face.position.z=.007;
  const eyes=[-1,1].map(side=>{const eye=new T.Mesh(new T.CircleGeometry(1,16),ink);eye.position.set(side*.205*head.part.width+head.part.faceX,.12*head.part.height,0);face.add(eye);return eye;});
  const mouthGeo=new T.BufferGeometry();mouthGeo.setAttribute('position',new T.BufferAttribute(new Float32Array(12*6*3),3));const mouth=new T.Mesh(mouthGeo,ink);face.add(mouth);
  function ribbon(targetArray,offset,a,b,width,front=0){const d=new T.Vector3().subVectors(b,a),normal=new T.Vector3().crossVectors(d,view).normalize().multiplyScalar(width/2),shift=view.clone().multiplyScalar(front),aa=a.clone().add(shift),bb=b.clone().add(shift);for(const p of [aa.clone().add(normal),aa.clone().sub(normal),bb.clone().add(normal),bb.clone().add(normal),aa.clone().sub(normal),bb.clone().sub(normal)]){targetArray[offset++]=p.x;targetArray[offset++]=p.y;targetArray[offset++]=p.z;}return offset;}
  function character(){for(const {part,rod,a,b} of strokes){const pa=sim.point(part.a),pb=sim.point(part.b),va=new T.Vector3(pa[0],pa[1],-pa[2]-part.depth),vb=new T.Vector3(pb[0],pb[1],-pb[2]-part.depth);a.position.copy(va);b.position.copy(vb);rod.position.copy(va).add(vb).multiplyScalar(.5);rod.scale.y=va.distanceTo(vb);rod.quaternion.setFromUnitVectors(unitY,new T.Vector3().subVectors(vb,va).normalize());}
    for(const {part,group} of shapes){const a=sim.point(part.a),b=part.b?sim.point(part.b):[a[0],a[1]+1,a[2]];group.position.set(a[0],a[1],-a[2]-part.depth);group.rotation.z=-Math.atan2(b[0]-a[0],b[1]-a[1]);}
    const b=sim.blend,eyeOpen=data.walk.face.eyes*(1-b)+data.run.face.eyes*b;
    for(const e of eyes)e.scale.set(.045*head.part.width,.065*head.part.height*eyeOpen,1);
    const smile=data.walk.face.smile*(1-b)+data.run.face.smile*b,width=(data.walk.face.mouthWidth*(1-b)+data.run.face.mouthWidth*b)*.2;
    const a=mouthGeo.attributes.position.array;let offset=0,prev=null;for(let i=0;i<=12;i++){const t=i/12,x=(2*t-1)*width,y=.2+2*(1-t)*t*smile*.19,v=new T.Vector3(x*head.part.width+head.part.faceX,-y*head.part.height,0);if(prev){const dx=v.x-prev.x,dy=v.y-prev.y,l=Math.hypot(dx,dy),nx=-dy/l*.045*.6*1.15/2,ny=dx/l*.045*.6*1.15/2;for(const p of [[prev.x+nx,prev.y+ny],[prev.x-nx,prev.y-ny],[v.x+nx,v.y+ny],[v.x+nx,v.y+ny],[prev.x-nx,prev.y-ny],[v.x-nx,v.y-ny]]){a[offset++]=p[0];a[offset++]=p[1];a[offset++]=0;}}prev=v;}mouthGeo.attributes.position.needsUpdate=true;
  }
  const clothMaterial=new T.MeshBasicMaterial({color:'#c43b40',side:T.DoubleSide});
  let cloth,geo,samples=[],rc,rr;
  function cubic(t){return[-.5*t+t*t-.5*t*t*t,1-2.5*t*t+1.5*t*t*t,.5*t+2*t*t-1.5*t*t*t,-.5*t*t+.5*t*t*t];}
  function makeSurface(){if(cloth){scene.remove(cloth);geo.dispose();}rc=opts.smooth?32:sim.cols;rr=opts.smooth?48:sim.rows;geo=new T.BufferGeometry();geo.setAttribute('position',new T.BufferAttribute(new Float32Array((rc+1)*(rr+1)*3),3));const indices=[];samples=[];
    for(let v=0;v<=rr;v++)for(let u=0;u<=rc;u++){const x=u/rc*sim.cols,y=v/rr*sim.rows,ix=Math.floor(x),iy=Math.floor(y),wx=cubic(x-ix),wy=cubic(y-iy),s=[];for(let j=0;j<4;j++)for(let i=0;i<4;i++)s.push([3*(Math.max(0,Math.min(sim.rows,iy+j-1))*(sim.cols+1)+Math.max(0,Math.min(sim.cols,ix+i-1))),wx[i]*wy[j]]);samples.push(s);if(u<rc&&v<rr){const a=v*(rc+1)+u;indices.push(a,a+1,a+rc+1,a+1,a+rc+2,a+rc+1);}}
    geo.setIndex(indices);cloth=new T.Mesh(geo,clothMaterial);cloth.frustumCulled=false;scene.add(cloth);
  }
  const linesGeo=new T.BufferGeometry();linesGeo.setAttribute('position',new T.BufferAttribute(new Float32Array(6000*18),3));const lines=new T.Mesh(linesGeo,ink);lines.frustumCulled=false;scene.add(lines);
  let wireGeo=new T.BufferGeometry();wireGeo.setAttribute('position',new T.BufferAttribute(new Float32Array(sim.constraints.filter(c=>c.type===0).length*6),3));const wire=new T.LineSegments(wireGeo,new T.LineBasicMaterial({color:'#fff0c9',depthTest:false}));wire.frustumCulled=false;wire.renderOrder=5;scene.add(wire);
  function remesh(){sim.setResolution(opts.mesh);wireGeo.dispose();wireGeo=new T.BufferGeometry();wireGeo.setAttribute('position',new T.BufferAttribute(new Float32Array(sim.constraints.filter(c=>c.type===0).length*6),3));wire.geometry=wireGeo;makeSurface();}
  const clasps=[0,sim.cols].map(()=>{const m=new T.Mesh(new T.SphereGeometry(.045,12,8),new T.MeshBasicMaterial({color:'#e8ad4d'}));scene.add(m);return m;});
  const ground=new T.LineSegments(new T.BufferGeometry().setFromPoints([new T.Vector3(-6,0,0),new T.Vector3(5,0,0)]),new T.LineBasicMaterial({color:'#aeb4aa'}));scene.add(ground);
  const ticksGeo=new T.BufferGeometry();ticksGeo.setAttribute('position',new T.BufferAttribute(new Float32Array(40*6),3));const ticks=new T.LineSegments(ticksGeo,new T.LineBasicMaterial({color:'#b8bdb2'}));scene.add(ticks);
  function surface(){const a=geo.attributes.position.array;for(let v=0;v<samples.length;v++){const idx=v*3;a[idx]=a[idx+1]=a[idx+2]=0;for(const [j,w] of samples[v]){a[idx]+=sim.p[j]*w;a[idx+1]+=sim.p[j+1]*w;a[idx+2]+=sim.p[j+2]*w;}if(v>rc)sim.project(a,idx,.028);a[idx+2]=-a[idx+2];}geo.attributes.position.needsUpdate=true;geo.computeVertexNormals();
    const normal=geo.attributes.normal.array,b=linesGeo.attributes.position.array;let count=0;
    const point=i=>new T.Vector3(a[i*3],a[i*3+1],a[i*3+2]);
    const line=(x,y)=>{if(count+18<=b.length)count=ribbon(b,count,x,y,.018,.004);};
    for(let v=0;v<=rr;v++)for(let u=0;u<=rc;u++){const i=v*(rc+1)+u;if(u<rc&&(v===0||v===rr))line(point(i),point(i+1));if(v<rr&&(u===0||u===rc))line(point(i),point(i+rc+1));
      if(u<rc&&v<rr){const ids=[i,i+1,i+rc+2,i+rc+1],hits=[];for(let e=0;e<4;e++){const k=ids[e],j=ids[(e+1)%4],dot=k=>normal[k*3]*view.x+normal[k*3+1]*view.y+normal[k*3+2]*view.z,da=dot(k),db=dot(j);if(da*db<0)hits.push(point(k).lerp(point(j),da/(da-db)));}if(hits.length===2)line(hits[0],hits[1]);}}
    linesGeo.setDrawRange(0,count/3);linesGeo.attributes.position.needsUpdate=true;
    cloth.visible=lines.visible=opts.cape;wire.visible=opts.wire&&opts.cape;
    if(wire.visible){const b=wireGeo.attributes.position.array;let i=0;for(const q of sim.constraints)if(q.type===0)for(const j of [q.a*3,q.b*3]){b[i++]=sim.p[j];b[i++]=sim.p[j+1];b[i++]=-sim.p[j+2];}wireGeo.attributes.position.needsUpdate=true;}
    clasps.forEach((m,k)=>{const i=(k?sim.cols:0)*3;m.position.set(sim.p[i],sim.p[i+1],-sim.p[i+2]+.015);m.visible=opts.cape;});
    const t=ticksGeo.attributes.position.array;for(let j=0;j<40;j++){const x=-5+j*.25-(sim.travel%.25),i=j*6;t[i]=t[i+3]=x;t[i+1]=0;t[i+4]=j%4===0?-.045:-.02;t[i+2]=t[i+5]=0;}ticksGeo.attributes.position.needsUpdate=true;
  }
  function resize(){const w=canvas.parentElement.clientWidth,h=canvas.parentElement.clientHeight;renderer.setSize(w,h,false);const halfY=Math.max(1.43,1.85/(w/h));camera.left=-halfY*w/h;camera.right=halfY*w/h;camera.top=halfY;camera.bottom=-halfY;camera.updateProjectionMatrix();}
  const ro=new ResizeObserver(resize);ro.observe(canvas.parentElement);
  let drag=null;canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!drag)return;azimuth=Math.max(-1.2,Math.min(1.2,azimuth-(e.clientX-drag[0])*.008));elevation=Math.max(-.2,Math.min(.75,elevation+(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY];aim();});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
  for(const el of root.querySelectorAll('[data-key]'))el.addEventListener(el.type==='range'?'input':'change',()=>{const k=el.dataset.key;opts[k]=el.type==='checkbox'?el.checked:typeof opts[k]==='number'?Number(el.value):el.value;Object.assign(sim.settings,opts);if(k==='mesh')remesh();else if(k==='smooth')makeSurface();sync();save();});
  q('[data-action="pause"]').onclick=()=>{paused=!paused;sync();};q('[data-action="view"]').onclick=()=>{azimuth=0;elevation=.03;aim();};
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);Object.assign(sim.settings,opts);remesh();sync();}});
  makeSurface();for(let i=0;i<180;i++)sim.step();resize();
  let last=performance.now(),accumulator=0,lastText=0;
  function frame(now){if(!root.isConnected){ro.disconnect();renderer.dispose();return;}const dt=Math.min(.04,(now-last)/1000);last=now;if(!paused&&!document.hidden){accumulator+=dt;let n=0;while(accumulator>=sim.dt&&n<5){sim.step();accumulator-=sim.dt;n++;}}character();surface();renderer.render(scene,camera);if(now-lastText>200){q('[data-speed]').textContent='Travel '+sim.speed.toFixed(2)+' u/s · Relative air '+(opts.air?sim.speed+opts.headwind:0).toFixed(2)+' u/s ← · '+(sim.blend<.01?'walking':sim.blend>.99?'running':'changing gait');lastText=now;}requestAnimationFrame(frame);}requestAnimationFrame(frame);
  }catch(e){q('[data-error]').hidden=false;q('[data-error]').textContent=e.message;console.error(e);}
})();
</script>
